name: Frontend CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks OSS
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location "$release/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep -E "[[:space:]]${archive}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan complete Git history (redacted)
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner'
  build-test:
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --watch=false
      - run: pnpm build:prod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-browser
          path: dist/sistema-dsc-frontend/browser
          retention-days: 7
          include-hidden-files: false
