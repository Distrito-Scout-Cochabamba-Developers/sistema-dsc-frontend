
<button
  #nativeButton
  [type]="type()"
  [class]="buttonClasses()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-expanded]="ariaExpanded() === null ? null : ariaExpanded()"
  [attr.aria-controls]="ariaControls() || null"
  [attr.aria-pressed]="ariaPressed() === null ? null : ariaPressed()"
  [attr.aria-busy]="loading() ? 'true' : null"
  (click)="onClick($event)"
>
  <!-- Indicador de carga -->
  @if (loading()) {
    <span
      class="h-4 w-4 animate-spin rounded-full border-2 border-current border-r-transparent"
      aria-hidden="true"
    ></span>
  } @else {
    <!-- Icono izquierdo -->
    <ng-content select="[button-icon-left]" />
  }

  <!-- Texto del botón -->
  @if (label()) {
    <span>{{ label() }}</span>
  } @else {
    <ng-content />
  }

  <!-- Icono derecho -->
  @if (!loading()) {
    <ng-content select="[button-icon-right]" />
  }
</button>
