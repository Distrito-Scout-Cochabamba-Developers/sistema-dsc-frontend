
<div
  class="relative inline-flex shrink-0 items-center justify-center"
  [style.width.px]="displaySize()"
  [style.height.px]="displaySize()"
  role="progressbar"
  [attr.aria-valuenow]="percentage()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-label]="'Progreso: ' + percentage() + '%'"
>
  <svg
    viewBox="0 0 100 100"
    class="h-full w-full -rotate-90"
    aria-hidden="true"
  >
    <!-- Fondo -->
    <circle
      cx="50"
      cy="50"
      r="42"
      fill="none"
      stroke="#E2E8F0"
      [attr.stroke-width]="displayStrokeWidth()"
    />

    <!-- Progreso -->
    <circle
      cx="50"
      cy="50"
      r="42"
      fill="none"
      [attr.stroke]="strokeColor()"
      [attr.stroke-width]="displayStrokeWidth()"
      stroke-linecap="round"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="strokeOffset()"
    />
  </svg>

  @if (showLabel()) {
    <span class="absolute text-sm font-semibold text-dsc-text">
      {{ percentage() | number:'1.0-0' }}%
    </span>
  }
</div>
