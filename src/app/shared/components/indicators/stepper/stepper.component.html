
<div
  [class]="orientation() === 'horizontal'
    ? 'flex w-full flex-col sm:flex-row'
    : 'flex w-full flex-col'"
  role="list"
  aria-label="Progreso por etapas"
>
  @for (step of steps(); track $index; let last = $last) {
    <div
      [class]="orientation() === 'horizontal'
        ? 'relative flex flex-1 flex-col items-center text-center'
        : 'relative flex min-h-20 gap-4'"
      role="listitem"
      [attr.aria-current]="isActive($index) ? 'step' : null"
    >
      <!-- Indicador y conector -->
      <div
        [class]="orientation() === 'horizontal'
          ? 'relative flex w-full items-center justify-center'
          : 'relative flex flex-col items-center'"
      >
        <span
          class="relative z-10 flex h-9 w-9 shrink-0 items-center justify-center rounded-full border-2 text-sm font-semibold transition-colors"
          [class.bg-dsc-primary]="isCompleted($index) || isActive($index)"
          [class.border-dsc-primary]="isCompleted($index) || isActive($index)"
          [class.text-white]="isCompleted($index) || isActive($index)"
          [class.border-slate-300]="isPending($index)"
          [class.bg-white]="isPending($index)"
          [class.text-slate-500]="isPending($index)"
        >
          @if (isCompleted($index)) {
            <span aria-hidden="true">✓</span>
            <span class="sr-only">Completado</span>
          } @else {
            {{ $index + 1 }}
          }
        </span>

        @if (!last) {
          <span
            aria-hidden="true"
            [class]="orientation() === 'horizontal'
              ? 'absolute left-1/2 top-1/2 h-0.5 w-full -translate-y-1/2'
              : 'absolute left-1/2 top-9 h-full w-0.5 -translate-x-1/2'"
            [class.bg-dsc-primary]="isCompleted($index)"
            [class.bg-slate-200]="!isCompleted($index)"
          ></span>
        }
      </div>

      <!-- Información del paso -->
      <div
        [class]="orientation() === 'horizontal'
          ? 'mt-3 px-2'
          : 'pb-6 pt-1'"
      >
        <p
          class="text-sm font-semibold"
          [class.text-dsc-primary]="isActive($index)"
          [class.text-dsc-text]="!isActive($index) && !isPending($index)"
          [class.text-slate-500]="isPending($index)"
        >
          {{ step.title }}
        </p>

        @if (showDescriptions() && step.description) {
          <p class="mt-1 text-xs text-slate-500">
            {{ step.description }}
          </p>
        }
      </div>
    </div>
  }
</div>
