
<label
  class="group flex cursor-pointer items-start gap-3"
  [class.cursor-not-allowed]="disabled()"
  [class.opacity-50]="disabled()"
>
  <input
    type="checkbox"
    class="peer sr-only"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange($event)"
  />

  <!-- Indicador visual -->
  <span
    class="mt-0.5 flex h-[18px] w-[18px] shrink-0 items-center
           justify-center rounded-[5px] border border-dsc-border
           bg-white transition-all duration-200
           peer-checked:border-dsc-primary
           peer-checked:bg-dsc-primary
           peer-focus-visible:ring-2
           peer-focus-visible:ring-dsc-primary/30
           group-hover:border-dsc-primary"
  >
    @if (checked()) {
      <svg
        class="h-3 w-3 text-white"
        viewBox="0 0 16 16"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M3 8L6.5 11.5L13 4.5"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    }
  </span>

  <!-- Contenido -->
  <span class="min-w-0">
    <span class="block text-sm font-medium text-dsc-text">
      {{ label() }}
    </span>

    @if (description()) {
      <span class="mt-1 block text-xs leading-relaxed text-slate-500">
        {{ description() }}
      </span>
    }
  </span>
</label>
