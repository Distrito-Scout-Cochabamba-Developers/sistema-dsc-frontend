
<div class="w-full">

  <label class="mb-2 block text-sm font-medium text-dsc-text" [attr.for]="id() || null">
    {{ label() }}
  </label>

  <div class="relative">
    <select
      class="w-full appearance-none rounded-lg border
             border-slate-300 bg-white px-3 py-2.5 pr-10
             text-sm text-dsc-text outline-none
             transition-colors
             focus:border-dsc-primary
             focus:ring-2 focus:ring-dsc-primary/15
             disabled:cursor-not-allowed
             disabled:bg-slate-100
             disabled:text-slate-400"
      [attr.id]="id() || null"
      [value]="value()"
      [disabled]="disabled()"
      (change)="onChange($event)"
    >

      <option value="" disabled>
        {{ placeholder() }}
      </option>

      @for (option of options(); track option.value) {
        <option [value]="option.value">
          {{ option.label }}
        </option>
      }

    </select>

    <!-- Flecha -->
    <svg
      class="pointer-events-none absolute right-3 top-1/2
             h-4 w-4 -translate-y-1/2 text-slate-500"
      viewBox="0 0 20 20"
      fill="none"
      aria-hidden="true"
    >
      <path
        d="M5 7.5L10 12.5L15 7.5"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  @if (hint()) {
    <p class="mt-1.5 text-xs text-slate-500">
      {{ hint() }}
    </p>
  }

</div>
