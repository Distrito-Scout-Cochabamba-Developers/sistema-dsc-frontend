
<div class="flex flex-col gap-1.5">
  <label
    [for]="id()"
    class="text-sm font-medium text-dsc-text"
  >
    {{ label() }}

    @if (required()) {
      <span class="text-red-500">*</span>
    }
  </label>

  <div class="relative">
    <input
      [id]="id()"
      type="date"
      [value]="value()"
      [min]="min() || null"
      [max]="max() || null"
      [required]="required()"
      [disabled]="disabled()"
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-dsc-text outline-none transition-colors focus:border-blue-500 focus:ring-2 focus:ring-blue-100 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-500"
      (change)="onDateChange($event)"
    />
  </div>

  @if (hint()) {
    <p class="text-xs text-slate-500">
      {{ hint() }}
    </p>
  }
</div>
