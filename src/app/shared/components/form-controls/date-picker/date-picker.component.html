<div class="flex w-full flex-col gap-2">

  <!-- Etiqueta -->
  <label
    [for]="inputId()"
    class="text-sm font-medium text-dsc-text"
  >
    {{ label() }}

    @if (required()) {
      <span
        class="ml-0.5 text-red-600"
        aria-hidden="true"
      >
        *
      </span>
    }
  </label>

  <!-- Selector de fecha -->
  <div class="relative">

    <!-- Icono de calendario -->
    <svg
      class="pointer-events-none absolute left-3 top-1/2
             h-5 w-5 -translate-y-1/2 text-slate-500"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M16 3v4M8 3v4M3 11h18" />
    </svg>

    <input
      #dateInput
      [id]="inputId()"
      type="date"
      [value]="value()"
      [min]="min() ?? null"
      [max]="max() ?? null"
      [required]="required()"
      [disabled]="disabled()"
      [attr.aria-describedby]="hint() ? inputId() + '-hint' : null"
      class="w-full rounded-xl border border-slate-300
             bg-white py-3 pl-10 pr-3
             text-sm text-dsc-text shadow-sm
             outline-none transition-all duration-200
             hover:border-slate-400
             focus:border-dsc-primary
             focus:ring-4 focus:ring-dsc-primary/10
             disabled:cursor-not-allowed
             disabled:border-slate-200
             disabled:bg-slate-100
             disabled:text-slate-400
             disabled:shadow-none"
      (change)="onDateChange($event)"
      (blur)="onBlur()"
    />

  </div>

  <!-- Texto de ayuda -->
  @if (hint()) {
    <p
      class="text-xs leading-relaxed text-slate-500"
      [id]="inputId() + '-hint'"
    >
      {{ hint() }}
    </p>
  }

</div>
