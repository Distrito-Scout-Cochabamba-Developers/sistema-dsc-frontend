
<div class="w-full">

  <!-- Etiqueta y contador -->
  <div class="mb-2 flex items-center justify-between gap-3">

    <label class="text-sm font-medium text-dsc-text">
      {{ label() }}
    </label>

    <span
      class="text-xs tabular-nums"
      [class.text-slate-400]="characterCount() <= maxLength()"
      [class.text-red-600]="characterCount() > maxLength()"
    >
      {{ characterCount() }} / {{ maxLength() }}
    </span>

  </div>

  <!-- Área de texto -->
  <textarea
    class="w-full resize-y rounded-lg border
           border-slate-300 bg-white px-3 py-2.5
           text-sm leading-relaxed text-dsc-text
           outline-none transition-colors
           placeholder:text-slate-400
           focus:border-dsc-primary
           focus:ring-2 focus:ring-dsc-primary/15
           disabled:cursor-not-allowed
           disabled:bg-slate-100
           disabled:text-slate-400"
    [value]="value()"
    [rows]="rows()"
    [maxLength]="maxLength()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
  ></textarea>

  @if (hint()) {
    <p class="mt-1.5 text-xs text-slate-500">
      {{ hint() }}
    </p>
  }

</div>
