
<div class="w-full">

  <label class="mb-2 block text-sm font-medium text-dsc-text">
    {{ label() }}
  </label>

  <div
    class="flex min-h-[58px] flex-wrap items-center gap-2
           rounded-lg border border-slate-300 bg-white p-2
           transition-colors
           focus-within:border-dsc-primary
           focus-within:ring-2
           focus-within:ring-dsc-primary/15"
    [class.opacity-60]="disabled()"
  >

    <!-- Etiquetas -->
    @for (tag of tags(); track $index) {
      <span
        class="inline-flex items-center gap-1.5 rounded-full
               bg-indigo-100 px-2.5 py-1
               text-xs font-medium text-indigo-900"
      >
        {{ tag }}

        <button
          type="button"
          class="rounded-full text-indigo-700
                 transition-colors hover:text-red-600
                 focus-visible:outline-none
                 focus-visible:ring-2 focus-visible:ring-dsc-primary"
          [disabled]="disabled()"
          [attr.aria-label]="'Eliminar etiqueta ' + tag"
          (click)="removeTag($index)"
        >
          <svg
            class="h-3 w-3"
            viewBox="0 0 16 16"
            fill="none"
            aria-hidden="true"
          >
            <path
              d="M4 4L12 12M12 4L4 12"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </span>
    }

    <!-- Entrada de texto -->
    <input
      type="text"
      class="min-w-[100px] flex-1 bg-transparent
             px-1 py-1 text-xs text-dsc-text
             outline-none placeholder:text-slate-400"
      [value]="draft()"
      [placeholder]="placeholder()"
      [disabled]="disabled() || tags().length >= maxTags()"
      (input)="updateDraft($event)"
      (keydown)="onKeydown($event)"
    />

    @if (draft().trim() && tags().length < maxTags()) {
      <button
        type="button"
        class="rounded-md px-2 py-1 text-xs
               font-medium text-dsc-primary
               hover:bg-sky-50"
        [disabled]="disabled()"
        (click)="addTag()"
      >
        Añadir
      </button>
    }

  </div>

  @if (hint()) {
    <p class="mt-1.5 text-xs text-slate-500">
      {{ hint() }}
    </p>
  }

</div>
