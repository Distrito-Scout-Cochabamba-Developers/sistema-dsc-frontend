<dialog
  #dialog
  aria-modal="true"
  class="fixed inset-0 z-50 m-auto h-fit max-h-[min(90dvh,40rem)] w-[min(calc(100%-2rem),32rem)] overflow-y-auto rounded-2xl border border-border bg-elevated p-0 shadow-xl backdrop:bg-ink/55"
  (close)="onNativeClose()"
>
  <form class="p-6" (submit)="onSubmit($event)" novalidate>
    <h2 class="m-0 text-xl font-bold text-ink">{{ title() }}</h2>

    @if (saveError()) {
      <p class="mt-2 rounded-md bg-danger-soft px-3 py-2 text-sm text-danger" role="alert">
        {{ saveError() }}
      </p>
    }

    <div class="mt-5 space-y-4">
      <app-text-field
        id="catalog-code"
        label="Código"
        [value]="formModel().code"
        [required]="true"
        [readonlyMode]="isEdit()"
        [maxLength]="30"
        [status]="codeHint() ? 'error' : 'default'"
        [hint]="codeHint()"
        (valueChange)="patchForm({ code: $event })"
      />
      <app-text-field
        id="catalog-name"
        label="Nombre"
        [value]="formModel().name"
        [required]="true"
        [maxLength]="150"
        [status]="nameHint() ? 'error' : 'default'"
        [hint]="nameHint()"
        (valueChange)="patchForm({ name: $event })"
      />
      <app-select
        id="catalog-type"
        label="Tipo"
        placeholder="Selecciona un tipo"
        [options]="typeOptions()"
        [value]="formModel().moduleTypeCode"
        [hint]="typeHint()"
        (valueChange)="patchForm({ moduleTypeCode: $event })"
      />
      <app-textarea
        id="catalog-description"
        label="Descripción"
        placeholder="Opcional"
        [value]="formModel().description"
        [rows]="3"
        [maxLength]="500"
        (valueChange)="patchForm({ description: $event })"
      />
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="rounded-lg border border-border px-4 py-2 text-sm font-medium text-ink hover:bg-surface"
        (click)="closed.emit()"
      >
        Cerrar
      </button>
      <button
        type="submit"
        class="rounded-lg bg-dsc px-4 py-2 text-sm font-semibold text-white transition hover:bg-dsc-dark disabled:cursor-not-allowed disabled:opacity-70"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'Guardando…' : 'Guardar' }}
      </button>
    </div>
  </form>
</dialog>
