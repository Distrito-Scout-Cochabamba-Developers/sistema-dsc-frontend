<form
  name="new-rover"
  class="space-y-4 rounded-xl border border-border bg-elevated p-4"
  method="post"
  autocomplete="off"
  (submit)="submit($event)"
>
  <h2 class="font-semibold">Registrar Rover sin cuenta</h2>
  <p class="text-muted">
    No hay una persona con ese CI. Se creará un perfil mínimo y se inscribirá en la convocatoria.
    No se crea cuenta ni se cambia la afiliación.
  </p>
  <div class="space-y-2">
    <label class="block font-medium" for="rover-first-name">Nombres</label>
    <input
      id="rover-first-name"
      name="firstName"
      type="text"
      required
      maxlength="120"
      autocomplete="off"
      class="w-full rounded-lg border border-border p-2"
      [disabled]="busy()"
      [value]="firstName()"
      (input)="firstName.set($any($event.target).value)"
    />
  </div>
  <div class="space-y-2">
    <label class="block font-medium" for="rover-last-name">Apellidos</label>
    <input
      id="rover-last-name"
      name="lastName"
      type="text"
      required
      maxlength="120"
      autocomplete="off"
      class="w-full rounded-lg border border-border p-2"
      [disabled]="busy()"
      [value]="lastName()"
      (input)="lastName.set($any($event.target).value)"
    />
  </div>
  <div class="space-y-2">
    <label class="block font-medium" for="rover-phone">Celular (opcional)</label>
    <input
      id="rover-phone"
      name="phone"
      type="tel"
      inputmode="tel"
      maxlength="16"
      autocomplete="off"
      class="w-full rounded-lg border border-border p-2"
      [disabled]="busy()"
      [value]="phone()"
      (input)="phone.set($any($event.target).value)"
    />
  </div>
  <p>La disponibilidad mostrada no garantiza el cupo hasta confirmar.</p>
  @if (message()) {
    <p role="alert">{{ message() }}</p>
  }
  <button
    type="submit"
    class="rounded-lg bg-dsc-navy px-4 py-2 font-semibold text-white disabled:opacity-60"
    [disabled]="busy()"
  >
    Registrar e inscribir
  </button>
</form>
