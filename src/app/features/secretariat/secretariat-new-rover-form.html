<form
  name="new-rover"
  class="space-y-4 rounded-xl border border-border bg-elevated p-4"
  method="post"
  autocomplete="off"
  (submit)="submit($event)"
>
  <h2 class="text-lg font-semibold text-dsc-navy">Registrar Rover</h2>
  <p class="text-sm leading-relaxed text-muted">
    Se creará un perfil sin cuenta y se inscribirá en la programación. No se cambia la afiliación.
  </p>
  <app-text-field inputId="rover-first-name" name="firstName" label="Nombres" [required]="true" [maxLength]="120" [disabled]="busy()" [value]="firstName()" (valueChange)="firstName.set($event)" />
  <app-text-field inputId="rover-last-name" name="lastName" label="Apellidos" [required]="true" [maxLength]="120" [disabled]="busy()" [value]="lastName()" (valueChange)="lastName.set($event)" />
  <app-text-field inputId="rover-phone" name="phone" label="Celular (opcional)" type="tel" [maxLength]="16" [disabled]="busy()" [value]="phone()" (valueChange)="phone.set($event)" />
  <p class="text-sm text-muted">El cupo se confirma al registrar la inscripción.</p>
  @if (message()) {
    <p role="alert">{{ message() }}</p>
  }
  <app-button type="submit" label="Registrar e inscribir" [disabled]="busy()" />
</form>
