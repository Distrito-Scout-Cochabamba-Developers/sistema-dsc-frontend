<div class="grid min-h-dvh bg-surface lg:grid-cols-2">
  <aside
    class="relative hidden items-center justify-center bg-linear-to-b from-dsc-soft to-white px-8 py-12 lg:flex"
    aria-hidden="true"
  >
    <img
      [ngSrc]="emblemSrc"
      width="560"
      height="560"
      priority
      alt=""
      class="h-auto w-full max-w-md object-contain"
    />
  </aside>

  <section class="flex min-h-dvh flex-col bg-surface px-5 py-5 sm:px-10">
    <header class="flex items-center justify-between gap-4">
      <a class="flex items-center gap-2 no-underline" routerLink="/" aria-label="Inicio DSC">
        <app-dsc-logo-badge size="sm" />
        <span class="text-lg font-bold text-dsc">DSC</span>
      </a>
      <p class="m-0 text-xs text-muted sm:text-sm">
        ¿Necesitas ayuda?
        <button
          type="button"
          class="font-semibold text-dsc"
          disabled
          [attr.title]="unavailableHint"
          [attr.aria-label]="unavailableHint"
        >
          Centro de ayuda
        </button>
      </p>
    </header>

    <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
      <img
        [ngSrc]="emblemSrc"
        width="200"
        height="200"
        alt="Emblema del Distrito Scout Cochabamba"
        class="mx-auto mb-6 h-auto w-40 object-contain lg:hidden"
      />
      <h1 class="m-0 text-3xl font-bold tracking-tight text-ink sm:text-4xl">Bienvenido</h1>
      <p class="mt-2 text-sm text-muted">Por favor ingresa tus datos de inicio de sesión</p>

      <form class="mt-8 space-y-5" (submit)="onSubmit($event)" novalidate>
        <app-text-field
          id="identifier"
          label="Usuario o correo"
          placeholder="pablo.rocha o correo"
          leadingIcon="at"
          [value]="loginModel().identifier"
          [required]="true"
          [status]="showIdentifierError() ? 'error' : 'default'"
          [hint]="identifierHint()"
          (valueChange)="onIdentifierInput($event)"
        />

        <app-text-field
          id="password"
          label="Contraseña"
          type="password"
          placeholder="••••••••"
          [value]="loginModel().password"
          [required]="true"
          [status]="showPasswordError() ? 'error' : 'default'"
          [hint]="passwordHint()"
          (valueChange)="onPasswordInput($event)"
        />

        <div class="flex items-center justify-between gap-3 text-sm">
          <app-checkbox
            label="Recuérdame"
            [checked]="rememberMe()"
            (checkedChange)="rememberMe.set($event)"
          />
          <button
            type="button"
            class="font-medium text-dsc"
            disabled
            [attr.title]="unavailableHint"
          >
            ¿Olvidé mi contraseña?
          </button>
        </div>

        @if (submitError()) {
          <div class="rounded-md bg-danger-soft px-3 py-2 text-sm text-danger" role="alert">
            <p class="m-0">{{ submitError() }}</p>
            @if (submitRetryable()) {
              <button type="button" class="mt-1 font-semibold underline" (click)="retrySubmit()">
                Reintentar
              </button>
            }
          </div>
        }

        <button
          type="submit"
          class="w-full rounded-md bg-dsc py-3 text-sm font-semibold text-white transition hover:bg-dsc-dark disabled:cursor-not-allowed disabled:opacity-70"
          [disabled]="submitting()"
        >
          {{ submitting() ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>
      </form>

      <div class="mt-8 flex items-center gap-3 text-xs text-muted">
        <span class="h-px flex-1 bg-border"></span>
        O continúa con
        <span class="h-px flex-1 bg-border"></span>
      </div>

      <button
        type="button"
        class="mt-5 flex w-full items-center justify-center gap-2 rounded-md border border-border bg-elevated py-3 text-sm font-medium text-ink disabled:cursor-not-allowed disabled:opacity-60"
        disabled
        [attr.title]="unavailableHint"
      >
        <svg class="size-5" viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23Z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09A6.97 6.97 0 0 1 5.48 12c0-.73.13-1.43.36-2.09V7.07H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84Z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53Z"
          />
        </svg>
        Google
      </button>

      <p class="mt-6 text-center text-sm text-muted">
        ¿No tienes una cuenta?
        <button
          type="button"
          class="font-semibold text-dsc"
          disabled
          [attr.title]="unavailableHint"
        >
          Regístrate
        </button>
      </p>
    </div>

    <footer class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 pb-2 text-xs text-muted">
      <span>© {{ currentYear }} DSC Inc.</span>
      <button type="button" disabled [attr.title]="unavailableHint">Política de privacidad</button>
      <button type="button" disabled [attr.title]="unavailableHint">Términos de servicio</button>
    </footer>
  </section>
</div>
