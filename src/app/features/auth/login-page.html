<div class="grid min-h-dvh bg-surface lg:grid-cols-2">
  <aside
    class="relative hidden items-center justify-center bg-linear-to-b from-dsc-soft to-white px-8 py-12 lg:flex"
    aria-hidden="true"
  >
    <img
      [ngSrc]="emblemSrc"
      width="560"
      height="560"
      priority
      alt=""
      class="h-auto w-full max-w-md object-contain"
    />
  </aside>

  <section class="flex min-h-dvh flex-col bg-surface px-5 py-5 sm:px-10">
    <div class="mx-auto flex w-full max-w-md flex-1 flex-col justify-center py-10">
      <img
        [ngSrc]="emblemSrc"
        width="200"
        height="200"
        alt="Emblema del Distrito Scout Cochabamba"
        class="mx-auto mb-6 h-auto w-40 object-contain lg:hidden"
      />
      <h1 class="m-0 text-3xl font-bold tracking-tight text-ink sm:text-4xl">Bienvenido</h1>
      <p class="mt-2 text-sm text-muted">Por favor ingresa tus datos de inicio de sesión</p>

      <form class="mt-8 space-y-5" (submit)="onSubmit($event)" novalidate>
        <div>
          <label class="mb-1.5 block text-sm font-medium text-ink" for="identifier">
            Usuario o correo
          </label>
          <div class="relative">
            <span
              class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted"
              aria-hidden="true"
            >
              <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3 7 9 6 9-6" />
              </svg>
            </span>
            <input
              id="identifier"
              type="text"
              autocomplete="username"
              placeholder="pablo.rocha o correo"
              class="w-full rounded-md border border-border bg-elevated py-3 pr-3 pl-11 text-sm text-ink outline-none ring-dsc/30 placeholder:text-muted/70 focus:ring-2"
              [class.border-danger]="showIdentifierError()"
              [attr.aria-invalid]="showIdentifierError()"
              [attr.aria-describedby]="showIdentifierError() ? 'identifier-hint' : null"
              [formField]="loginForm.identifier"
              (blur)="touchedIdentifier.set(true)"
            />
          </div>
          @if (showIdentifierError()) {
            <p id="identifier-hint" class="mt-1.5 text-sm text-danger">
              {{ loginForm.identifier().errors()[0]?.message }}
            </p>
          }
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-ink" for="password">Contraseña</label>
          <div class="relative">
            <span
              class="pointer-events-none absolute top-1/2 left-3 -translate-y-1/2 text-muted"
              aria-hidden="true"
            >
              <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V8a4 4 0 0 1 8 0v3" />
              </svg>
            </span>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="••••••••"
              class="w-full rounded-md border border-border bg-elevated py-3 pr-11 pl-11 text-sm text-ink outline-none ring-dsc/30 placeholder:text-muted/70 focus:ring-2"
              [class.border-danger]="showPasswordError()"
              [attr.aria-invalid]="showPasswordError()"
              [attr.aria-describedby]="showPasswordError() ? 'password-hint' : null"
              [formField]="loginForm.password"
              (blur)="touchedPassword.set(true)"
            />
            <button
              type="button"
              class="absolute top-1/2 right-2 -translate-y-1/2 rounded p-1 text-muted hover:text-ink"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword()) {
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M3 3l18 18" />
                  <path d="M10.6 10.6A2 2 0 0 0 13.4 13.4" />
                  <path d="M9.9 5.2A10.5 10.5 0 0 1 12 5c7 0 10 7 10 7a18 18 0 0 1-4.2 5.1" />
                  <path d="M6.1 6.1C3.5 8 2 12 2 12s3 7 10 7a10 10 0 0 0 4.3-.9" />
                </svg>
              } @else {
                <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              }
            </button>
          </div>
          @if (showPasswordError()) {
            <p id="password-hint" class="mt-1.5 text-sm text-danger">
              {{ loginForm.password().errors()[0]?.message }}
            </p>
          }
        </div>

        <div class="flex items-center justify-between gap-3 text-sm">
          <label class="flex cursor-pointer items-center gap-2 text-ink">
            <input
              type="checkbox"
              class="size-4 rounded border-border accent-dsc"
              [checked]="rememberMe()"
              (change)="onRememberMeChange($event)"
            />
            Recuérdame
          </label>
          <button
            type="button"
            class="font-medium text-dsc"
            disabled
            [attr.title]="unavailableHint"
          >
            ¿Olvidé mi contraseña?
          </button>
        </div>

        @if (submitError()) {
          <div class="rounded-md bg-danger-soft px-3 py-2 text-sm text-danger" role="alert">
            <p class="m-0">{{ submitError() }}</p>
            @if (submitRetryable()) {
              <button type="button" class="mt-1 font-semibold underline" (click)="retrySubmit()">
                Reintentar
              </button>
            }
          </div>
        }

        <button
          type="submit"
          class="w-full rounded-md bg-dsc py-3 text-sm font-semibold text-white transition hover:bg-dsc-dark disabled:cursor-not-allowed disabled:opacity-70"
          [disabled]="submitting()"
        >
          {{ submitting() ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>
      </form>

    </div>
  </section>
</div>
